name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
            artifact: windows-x64
          - os: macos-latest
            command: build:mac:arm64
            artifact: macos-arm64
          - os: macos-latest
            command: build:mac:x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: sensepilot-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
